<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Agent | Dein persönlicher Auto-Kaufberater</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card:hover { border-color: rgba(59, 130, 246, 0.35); }
    .score-badge { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header & Navigation -->
  <header class="sticky top-0 z-50 glass-card border-b border-slate-800 bg-slate-900/90 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="/" class="flex items-center space-x-3 group">
          <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/25 group-hover:scale-105 transition-transform">
            <i class="fa-solid fa-car-side text-lg"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
              Auto-Agent
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">97271 Kleinrinderfeld</span>
            </h1>
            <p class="text-xs text-slate-400">Marktbeobachter &amp; Deal-Scout (100 km Radius)</p>
          </div>
        </a>
      </div>

      <div class="flex items-center space-x-4">
        <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:text-white hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-gauge mr-1.5 text-blue-400"></i> Dashboard
        </a>
        <a href="/compare" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:text-white hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-code-compare mr-1.5 text-indigo-400"></i> Direktvergleich
        </a>
        <a href="/?tab=favorites" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:text-white hover:bg-slate-800/60 transition">
          <i class="fa-solid fa-heart mr-1.5 text-rose-500"></i> Favoriten
        </a>

        <!-- Manueller Suchlauf -->
        <form action="/api/search-now" method="POST" class="inline">
          <button type="submit" class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-lg text-sm font-semibold shadow-lg shadow-blue-600/30 transition transform active:scale-95">
            <i class="fa-solid fa-rotate"></i>
            <span>Jetzt suchen</span>
          </button>
        </form>
      </div>
    </div>
  </header>

  <!-- Hauptinhalt -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-800 bg-slate-950/80 px-6 py-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <p>Auto-Agent &bull; Überwacht mobile.de &amp; AutoScout24 im 100 km Umkreis von 97271 Kleinrinderfeld</p>
      <p class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Hintergrund-Crawler aktiv
      </p>
    </div>
  </footer>

  <script>
    async function toggleFavorite(carId, btn) {
      try {
        const res = await fetch(`/api/favorite/${carId}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          const icon = btn.querySelector('i');
          if (data.is_favorite) {
            icon.classList.remove('fa-regular', 'text-slate-400');
            icon.classList.add('fa-solid', 'text-rose-500');
          } else {
            icon.classList.remove('fa-solid', 'text-rose-500');
            icon.classList.add('fa-regular', 'text-slate-400');
          }
        }
      } catch (err) {
        console.error('Fehler beim Speichern des Favoriten:', err);
      }
    }
  </script>
</body>
</html>
