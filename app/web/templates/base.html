<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Auto-Agent &bull; Fahrzeug-Tracking &amp; Vergleich{% endblock %}</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151f32',
              950: '#070b14',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.6);
    }
    .glass-nav {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(30, 41, 59, 0.8);
    }
    .scrollbar-thin::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-50 glass-nav">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo & Subline -->
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/20 group-hover:scale-105 transition">
          <i class="fa-solid fa-car-side text-sm"></i>
        </div>
        <div>
          <span class="text-base font-black tracking-tight text-white block leading-none">Auto-Agent</span>
          <span class="text-[10px] text-slate-400 font-medium">97271 Kleinrinderfeld &bull; 100 km Radius</span>
        </div>
      </a>

      <!-- Hauptnavigation & Aktions-Buttons -->
      <div class="flex items-center gap-2 sm:gap-4">
        
        <nav class="flex items-center gap-1.5 sm:gap-2">
          <!-- Dashboard -->
          <a href="/" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-1.5">
            <i class="fa-solid fa-table-cells-large text-slate-400"></i>
            <span>Dashboard</span>
          </a>

          <!-- Direktvergleich -->
          <a href="/compare" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-1.5">
            <i class="fa-solid fa-code-compare text-slate-400"></i>
            <span>Vergleich</span>
          </a>

          <!-- Kriterien / Einstellungen -->
          <a href="/settings" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-1.5 border border-slate-800">
            <i class="fa-solid fa-gear text-slate-400"></i>
            <span>Kriterien</span>
          </a>
        </nav>

        <div class="h-6 w-px bg-slate-800 hidden sm:block"></div>

        <!-- Manueller Suchlauf Button -->
        <form action="/api/search-now" method="POST" class="m-0">
          <button type="submit" class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white shadow-md shadow-blue-600/30 transition flex items-center gap-1.5">
            <i class="fa-solid fa-rotate"></i>
            <span class="hidden sm:inline">Jetzt suchen</span>
          </button>
        </form>

      </div>
    </div>
  </header>

  <!-- Hauptinhalt -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-950/40 py-5 text-center text-xs text-slate-500 mt-auto">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Auto-Agent aktiv &bull; FastAPI + SQLite auf Unraid</span>
      </div>
      <div>
        <span>Fahrzeug-Tracking: mobile.de &bull; AutoScout24</span>
      </div>
    </div>
  </footer>

  <!-- Globale JavaScript-Hilfsfunktionen -->
  <script>
    async function toggleFavorite(carId, btnElement) {
      try {
        const resp = await fetch(`/api/favorite/${carId}`, { method: 'POST' });
        const data = await resp.json();
        if (data.success) {
          const icon = btnElement.querySelector('i');
          if (data.is_favorite) {
            icon.classList.remove('fa-regular', 'text-slate-400');
            icon.classList.add('fa-solid', 'text-rose-500');
          } else {
            icon.classList.remove('fa-solid', 'text-rose-500');
            icon.classList.add('fa-regular', 'text-slate-400');
          }
        }
      } catch (e) {
        console.error('Fehler beim Umschalten des Favoriten-Status:', e);
      }
    }
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
